  </g>
  <text x="256" y="380" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" letter-spacing="4" text-anchor="middle">GYM <tspan fill="#00E5FF">APP</tspan></text>
